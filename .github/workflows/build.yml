name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Build
        run: |
          chmod +x gradlew
          mkdir -p /tmp/report
          set +e
          ./gradlew build --console=plain > /tmp/report/build.log 2>&1
          echo $? > /tmp/report/exitcode.txt
          exit 0
      - name: Discover API
        run: bash .github/scripts/discover.sh || true
      - name: Publish report
        run: |
          cd /tmp/report
          git init -q -b report
          git config user.name "zpvp-ci"
          git config user.email "ci@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add -A
          git commit -q -m "report for ${{ github.sha }}"
          git push -f origin report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zpvp-jar
          path: build/libs/*.jar
          if-no-files-found: ignore
      - name: Fail if build failed
        run: test "$(cat /tmp/report/exitcode.txt)" = "0"
